<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Millr, the AI Machinist: __FILE__</title>
<style>
/* Millr review page: one system. Tokens, then type, then layout, then components, then states and motion. */
:root{--f:-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --ink:#141517;--muted:#6B6F76;--line:#E6E5E1;--page:#F4F3F0;--card:#FFFFFF;--tint:#FBF1EB;--mark:#F8D3C0;--metal:#8C939C;
  --flag:#EC6636;--head:#BF4418;--flagtext:#8A2E12;--ok:#3F7D5C;--tag:#000000;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--r:12px;--rs:6px;--pin:0px}   /* --pin: the height of the part pinned above the list on a phone */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#F2F2F0;--muted:#A6A9AE;--line:#33363A;--page:#1A1B1D;--card:#232527;--tint:#3A2219;--mark:#7A3A1E;--head:#FFA37A;--flagtext:#FFD2BF;--ok:#7CC49B;--metal:#B8BCC2}}
:root[data-theme="dark"]{--ink:#F2F2F0;--muted:#A6A9AE;--line:#33363A;--page:#1A1B1D;--card:#232527;--tint:#3A2219;--mark:#7A3A1E;--head:#FFA37A;--flagtext:#FFD2BF;--ok:#7CC49B;--metal:#B8BCC2}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.55 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
/* type roles */
h1{font:700 28px/1.15 var(--f);letter-spacing:-.022em;margin:0 0 var(--s2)}
h2,.k,.dlab,.jm,.revision .rl,.fixbox .lab,.cv .lab{display:block;font:700 14.5px/1.4 var(--f);color:var(--head);margin:0 0 var(--s2)}
.more .k,.jm{margin-bottom:var(--s1)}
.sub,.cond,.status,.vfoot,.loading,.sheet p{color:var(--muted)}
.sub{font:400 14px/1.5 var(--f);margin:0 0 var(--s5)}.cond{font:400 15px/1.5 var(--f)}
/* layout */
.app{display:grid;grid-template-columns:minmax(360px,460px) 1fr;gap:var(--s4);height:100%;padding:var(--s4);max-width:1600px;margin:0 auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s6) var(--s6) var(--s5);overflow:auto}
.view{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;min-height:420px}
.sec+.sec{margin-top:var(--s6)}#makesec,#decidesec{padding-top:var(--s5);border-top:1px solid var(--line)}
@media (max-width:760px){:root{--pin:300px}.app{grid-template-columns:1fr;height:auto;gap:var(--s3)}.view{order:-1;position:sticky;top:0;z-index:2;height:var(--pin);min-height:var(--pin)}.stage{min-height:0}.panel{padding:var(--s5) var(--s4);overflow:visible}}   /* phone: the part stays pinned on top, the list scrolls beneath it */
/* summary and sections */
#makesec h2,#decidesec h2{font:700 17px/1.4 var(--f);border-bottom:2px solid var(--head);padding-bottom:var(--s3);margin:0 0 var(--s1)}
#makesec .status{display:flex;gap:var(--s2);align-items:flex-start;font:500 16px/1.5 var(--f);color:var(--ink);padding:var(--s1) 0 0;margin:0 0 var(--s2)}
#makesec .dot{width:10px;height:10px;border-radius:50%;background:var(--flag);margin-top:7px;flex:none}
#nextsec>.k,#revsec>.k{margin-bottom:var(--s3)}
/* the list of changes */
.finding{position:relative;scroll-margin-top:calc(var(--pin) + var(--s3));transition:background .2s ease,border-color .2s ease}   /* a change brought into view stops just below the pinned part */
.finding+.finding{border-top:2px solid var(--ink)}
.fhead{display:block;width:100%;text-align:left;background:none;border:0;padding:var(--s5) 40px var(--s5) 0;color:inherit;font:inherit;cursor:pointer;border-radius:var(--rs);position:relative;transition:background .15s ease}
.fhead:hover{background:color-mix(in srgb,var(--line) 35%,transparent)}.fhead:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.ftitle{display:flex;align-items:baseline;gap:var(--s3);font:700 17px/1.35 var(--f);color:var(--head);letter-spacing:-.005em}
.num{min-width:26px;color:var(--head);font:700 19px/1.2 var(--f)}.state-tag{display:none;margin-left:var(--s1);font:700 12px/1.4 var(--f);color:var(--flagtext)}
.ixc{display:block;margin:var(--s2) 0 0 38px;font:400 14px/1.4 var(--f);color:var(--ink)}
.flags{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);margin:var(--s2) 0 0 38px}
.fc{display:inline-flex;align-items:center;gap:6px;font:700 12.5px/1.4 var(--f);color:var(--ink)}.fc i{width:9px;height:9px;border-radius:50%;background:var(--flag);display:inline-block}
.fc.medium i{background:linear-gradient(90deg,var(--flag) 50%,transparent 50%);box-shadow:inset 0 0 0 1.5px var(--flag)}
.chev{position:absolute;right:14px;top:30px;width:9px;height:9px;border-right:2px solid var(--head);border-bottom:2px solid var(--head);transform:rotate(45deg);transition:transform .2s ease}
.finding.open .chev{transform:rotate(225deg);top:34px}
.undo{display:none;position:absolute;top:var(--s2);right:0;width:36px;height:36px;border-radius:50%;border:1px solid transparent;background:none;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;z-index:1}
.undo:hover,.undo:focus-visible{color:var(--ink);border-color:var(--line)}.undo:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
/* open, approved, ignored */
.finding.open{border:2px solid var(--head);border-radius:var(--r);padding:0 var(--s4) var(--s2);margin:var(--s4) 0;background:var(--card)}.finding.open .fhead{background:var(--tint);margin:0 calc(-1 * var(--s4));width:calc(100% + 2 * var(--s4));padding-left:var(--s4);padding-right:56px;border-radius:10px 10px 0 0}   /* the tint spans the card edge to edge */
.finding.open+.finding,.finding+.finding.open{border-top:0}.finding.open .fhead:hover{background:none}
.finding.approved{background:var(--tint);border-radius:var(--r);margin-top:var(--s2);padding-left:var(--s3)}.finding.approved+.finding{border-top:0;margin-top:var(--s2)}
.finding.approved .state-tag,.finding.ignored .state-tag{display:inline}.finding.ignored{opacity:.5}.finding.ignored .ftitle,.finding.ignored .num{color:var(--muted)}
.finding.approved .undo,.finding.ignored .undo{display:block}.finding.approved .chev,.finding.ignored .chev{display:none}
/* the detail, animated open and closed */
.detail{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .22s ease,visibility 0s .22s;overflow:hidden}.finding.open .detail{grid-template-rows:1fr;visibility:visible;transition-delay:0s}   /* hidden: closed details leave the tab order */
.finding.snap .detail{transition:none}   /* after a decision the decided change closes and the next opens at once, so the list can scroll straight to the next one's top */
.dwrap{min-height:0;overflow:hidden}.detail .cond{margin:0 0 var(--s4)}
.fsec{padding:var(--s4) 0}.fsec+.fsec{border-top:1px solid var(--line)}.fsec>p,.fsec>.judg{margin:0}
.fixbox{background:var(--tint);border-left:3px solid var(--flag);padding:var(--s4) var(--s5) var(--s4) var(--s5);margin:0 0 var(--s1)}
.change{display:grid;grid-template-columns:auto 1fr;gap:var(--s1) var(--s4);align-items:baseline;margin:0 0 var(--s4)}
.cv{display:contents}.cv .lab{margin:0;font:700 12.5px/1.4 var(--f);color:var(--muted)}.cv.to .lab{color:var(--head)}
.cv strong{font:700 24px/1.15 var(--f);letter-spacing:-.018em;color:var(--ink)}.cv.to strong{color:var(--flag)}.arrow{display:none}
.fixline{font:500 16px/1.45 var(--f);margin:0;letter-spacing:-.005em}
mark.hl{background:none;color:inherit;font-weight:700}b.hn{font-weight:700}
.btnrow{display:flex;gap:var(--s2);flex-wrap:wrap}.btnrow.big{gap:var(--s2);margin:0 0 var(--s2)}
.btn{font:500 13.5px/1.2 var(--f);letter-spacing:.01em;border-radius:var(--rs);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .1s ease}
.btn:hover{border-color:var(--ink)}.btn:active{transform:translateY(1px)}.btn:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.btn.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btnrow.big .btn{flex:1;padding:14px var(--s4);font:500 15px/1.2 var(--f)}
.btn.go{background:var(--flag);border-color:var(--flag);color:#141517}.btn.go:hover{filter:brightness(1.06)}.btn.ign{background:none;border:1px solid var(--ink);color:var(--ink)}
.btn.link{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font:400 13px/1.2 var(--f);padding:2px 6px}.btn.link:hover{color:var(--flagtext)}
.more{margin-top:var(--s1);font:400 15px/1.6 var(--f)}.more .fsec:first-child{border-top:1px solid var(--line)}.more p{margin:0 0 var(--s3)}
.more .k.decide.safe{color:var(--ok)}.judg{font:400 15px/1.6 var(--f)}
.fold{padding:var(--s3) 0}.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:var(--s2);margin:0;user-select:none}.fold>summary::-webkit-details-marker{display:none}.fold>summary::after{content:'';width:7px;height:7px;border-right:1.5px solid var(--head);border-bottom:1.5px solid var(--head);transform:rotate(-45deg);transition:transform .15s;margin-left:auto}.fold[open]>summary::after{transform:rotate(45deg)}.fold[open]>summary{margin-bottom:var(--s2)}.fold>summary:focus-visible{outline:2px solid var(--flag);outline-offset:2px;border-radius:2px}.fold .judg,.fold .src{margin:0}
.finding.open .ixc{display:none}
/* next step, revision, brand */
.next{display:none;border:1.5px solid var(--flag);background:var(--tint);border-radius:var(--r);padding:var(--s5)}.next.show{display:block}
.next b{display:block;font:700 18px/1.3 var(--f);letter-spacing:-.012em;margin-bottom:var(--s2)}.next p{font:400 14.5px/1.6 var(--f);color:var(--muted);margin:0 0 var(--s3)}
.revision{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:var(--s4) 0;font:400 14.5px/1.6 var(--f)}.revision b{display:block;font:700 15px/1.4 var(--f);margin-bottom:var(--s1)}
.revision ul{margin:2px 0 6px;padding-left:18px}.revision .rl{margin:var(--s2) 0 2px}.revision .rl.ok{color:var(--ok)}.revision .rl.open{color:var(--flagtext)}
.brand{margin-top:var(--s6);display:flex;gap:8px;align-items:center;font:500 12.5px/1.4 var(--f);color:var(--muted)}.brand .wm{font:900 13px/1 var(--f);letter-spacing:.02em;color:var(--ink);margin-right:2px}.brand i{width:9px;height:14px;background:var(--flag);display:inline-block;transform:skewX(-12deg);border-radius:1px}   /* the Millr mark: a tall parallelogram leaning right, 12 degrees */
/* the 3D view */
.vhead{padding:var(--s3) var(--s4);font:400 13.5px/1.5 var(--f);color:var(--muted);border-bottom:1px solid var(--line)}.vhead b{font:700 14.5px/1.5 var(--f);color:var(--ink);margin-right:var(--s2)}
.stage{position:relative;flex:1;min-height:340px;touch-action:none}canvas{display:block;width:100%;height:100%}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 13.5px/1.5 var(--f);letter-spacing:.02em;background:linear-gradient(100deg,var(--card) 30%,color-mix(in srgb,var(--line) 60%,var(--card)) 50%,var(--card) 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.vfoot{padding:var(--s2) var(--s4);font:400 11.5px/1.5 var(--f);letter-spacing:.02em;border-top:1px solid var(--line)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,12,14,.45);display:none;align-items:center;justify-content:center;padding:var(--s4);z-index:10}.modal.show{display:flex}
.sheet{background:var(--card);color:var(--ink);border-radius:var(--r);max-width:720px;width:100%;max-height:90vh;display:flex;flex-direction:column;padding:var(--s5)}
.sheet h3{font:700 18px/1.3 var(--f);letter-spacing:-.012em;margin:0 0 var(--s1)}.sheet p{margin:0 0 var(--s3);font:400 13.5px/1.55 var(--f)}
.sheet textarea{flex:1;min-height:260px;width:100%;resize:vertical;font:13px/1.55 var(--mono);color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:var(--rs);padding:var(--s3)}
@media (prefers-reduced-motion:reduce){.detail,.chev,.finding,.btn,.fhead{transition:none}.loading{animation:none}}
/* print: the whole review on paper, every change open, in light colors, with a still of the part on top */
.printhead{display:none}
@media print{
  @page{margin:14mm}
  :root:not(#print){--ink:#141517;--muted:#5B6068;--line:#DCDBD7;--page:#FFFFFF;--card:#FFFFFF;--tint:#FBF1EB;--head:#BF4418;--flagtext:#8A2E12;--ok:#3F7D5C;--pin:0px;color-scheme:light}   /* light, whatever the screen uses */
  html,body{height:auto;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}body{padding:0}
  .app{display:block;height:auto;padding:0;max-width:none}.panel{border:0;border-radius:0;padding:0;overflow:visible}
  .view,.modal,.sub,#nextsec,.acts,.undo,.chev,.ixc{display:none!important}
  .printhead{display:block;margin:0 0 var(--s5)}.phfile{margin:0 0 var(--s2);font:400 13px/1.5 var(--f);color:var(--muted)}.phfile b{color:var(--ink);font-weight:700;margin-right:var(--s2)}
  #printshot{display:block;width:100%;max-height:85mm;object-fit:contain;border:1px solid var(--line);border-radius:var(--r)}#printshot:not([src]){display:none}
  .phcredit{margin:var(--s2) 0 0;font:400 11px/1.5 var(--f);color:var(--muted)}.phcredit:empty{display:none}
  .finding,.finding.open,.finding.approved,.finding.ignored{border:0;border-top:2px solid var(--ink);border-radius:0;margin:0;padding:0 0 var(--s3);background:none;opacity:1}
  #blocking>.finding:first-child,#improve>.finding:first-child{border-top:0}
  .fhead,.fhead:hover,.finding.open .fhead{background:none;margin:0;width:100%;padding:var(--s4) 0 var(--s2);break-after:avoid;page-break-after:avoid}
  .detail{display:block;visibility:visible;transition:none}.dwrap{overflow:visible}
  .fixbox,.fsec>p,.fold{break-inside:avoid;page-break-inside:avoid}
  .finding.ignored .ftitle,.finding.ignored .num{color:var(--muted)}
}
</style></head>
<body><div class="app">
<section class="panel" aria-label="Review">
  <header class="printhead" aria-hidden="true"><p class="phfile"><b>__FILE__</b><span>__DESC__</span></p><img id="printshot" alt=""><p class="phcredit">__CREDIT__</p></header>
  <section class="sec summary">
  <h1 id="headline"></h1>
  <p class="sub">Open a change to see it on the part.</p></section>
  <section class="sec" id="makesec"><h2>Cannot be machined as drawn</h2>
  <div id="status" class="status"><span class="dot"></span><span id="statustext"></span></div>
  <div id="blocking"></div></section>
  <section class="sec" id="decidesec"><h2 id="score"></h2>
  <div id="improve"></div></section>
  <section class="sec" id="nextsec"><p class="k">Next step</p><div id="next" class="next"></div></section>
  <section class="sec" id="revsec"><p class="k">Revision check</p><div id="revision"></div></section>

  <p class="brand"><i></i><b class="wm">MILLR</b> the AI Machinist</p>
</section>
<section class="view" aria-label="3D view of the part">
  <div class="vhead"><b>__FILE__</b><span>__DESC__</span></div>
  <div class="stage" id="stage" role="img" aria-label="3D view of the part. Each change in the list lights up where it is on the part."><div class="loading" id="loading">Loading your part</div></div>
  <div class="vfoot">__CREDIT__</div>
</section></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle"><div class="sheet">
  <h3 id="mtitle"></h3><p id="mnote"></p><textarea id="mtext" readonly></textarea>
  <div class="btnrow"><button class="btn primary" id="mcopy">Copy</button><button class="btn" id="mclose">Close</button></div></div></div>
<script>__THREE__</script>
<script>
const PART = __PART__;
const REVIEW = __REVIEW__;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
// ---------- review panel ----------
const FLAGNAME={cost:'Cost','lead time':'Lead time',risk:'Risk'},FLAGKEYS=['cost','lead time','risk'];
const level=(f,k)=>{const v=String(f.flags&&f.flags[k]||'').toLowerCase();return v==='high'||v==='medium'?v:'low'};
const andList=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const flagGroups=f=>{const lv=FLAGKEYS.map(k=>[k,level(f,k)]);   // grouped by level, high first: [['high','High risk'],['medium','Medium cost and lead time']]
  return ['high','medium'].map(L=>[L,lv.filter(([,v])=>v===L).map(([k])=>k)]).filter(([,ks])=>ks.length).map(([L,ks])=>[L,(L==='high'?'High ':'Medium ')+andList(ks)])};
const flagWords=f=>flagGroups(f).map(([,t])=>t.toLowerCase()).join('; ');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NUM=/((?:R|\u00d8|M|\u00b1)?\d+(?:[.,]\d+)?(?:\/\d+)?(?:\s?(?:mm|in|\u00b5m|\u00b0|%|diameters?|times|\u00d7\s?D|x\s?D))?)(?![\w\/-])/g;
const hl=(s,auto=false)=>{const raw=String(s==null?'':s);if(/\*\*[^*]+\*\*/.test(raw))return raw.split(/\*\*([^*]+)\*\*/).map((p,i)=>i%2?'<mark class="hl">'+esc(p)+'</mark>':esc(p)).join('');if(!auto)return esc(raw);return raw.split(NUM).map((p,i)=>i%2?'<b class="hn">'+esc(p)+'</b>':esc(p)).join('')};   // marks and figures are found in the raw text and escaped piece by piece, so an apostrophe's entity is never highlighted
const plain=s=>String(s==null?'':s).replace(/\*\*/g,'');
const short=s=>{s=plain(s).trim();if(s.length<=28)return s;const c=s.slice(0,27);return (c.includes(' ')?c.replace(/\s+\S*$/,''):c)+'\u2026'};   // the card shows the value whole when it fits, else its first words and an ellipsis; the fix carries all of it
const basisHtml=s=>String(s==null?'':s).trim().split(/\n\s*\n/).filter(Boolean).map(p=>`<p class="judg">${esc(p)}</p>`).join('');
function card(f,i,kind){
  const ranges = kind==='b' ? '' : `<div class="flags">${flagGroups(f).map(([L,t])=>`<span class="fc on ${L}"><i></i>${esc(t)}</span>`).join('')}</div>`;
  const id=`${kind}${i}`, num=String((kind==='b'?i:blk.length+i)+1);
  return `<article class="finding" data-i="${i}" data-kind="${kind}">
    <button class="undo" data-act="undo" aria-label="Undo this decision" title="Undo">&#8634;</button><button class="fhead" aria-expanded="false" aria-controls="d-${id}"><span class="chev" aria-hidden="true"></span><span class="ftitle"><span class="num">${num}</span>${esc(f.title)}<span class="state-tag"></span></span><span class="ixc">${esc(short(f.edit.current))} \u2192 ${esc(short(f.edit.target))}</span>${ranges}</button>
    <div class="detail" id="d-${id}"><div class="dwrap"><p class="cond">${hl(f.condition)}</p><div class="fsec fixbox"><div class="change"><div class="cv"><span class="lab">Now</span><strong>${esc(short(f.edit.current))}</strong></div><span class="arrow" aria-hidden="true">\u2192</span><div class="cv to"><span class="lab">Change to</span><strong>${esc(short(f.edit.target))}</strong></div></div><p class="fixline">${hl(f.fix)}</p></div>
      <div class="fsec acts"><div class="btnrow big"><button class="btn go" data-act="approve">Fix this</button><button class="btn ign" data-act="ignore">Ignore</button></div></div>
      <div class="more"><div class="fsec"><p><span class="k">Why it matters</span>${hl(f.why)}</p></div>
      <div class="fsec"><p><span class="k decide ${f.decide.safe?'safe':''}">${f.decide.safe?'Safe to apply':'Before you change it'}</span>${hl(f.decide.safe?String(f.decide.note||'').replace(/^\s*safe to apply\s*[:.,;-]?\s*/i,''):f.decide.note,false)}</p></div>
      ${basisHtml(f.basis)?`<details class="fsec fold"><summary class="k">How Claude worked it out</summary>${basisHtml(f.basis)}</details>`:''}</div></div></div></article>`}
const shown=f=>FLAGKEYS.some(k=>{const v=String(f.flags&&f.flags[k]||'').toLowerCase();return v==='medium'||v==='high'});
const blk=REVIEW.blocking||[], imp=(REVIEW.improvements||[]).filter(shown);   // a change with nothing at medium or high stays in review.json and off the page
document.getElementById('makesec').style.display=blk.length?'':'none';
document.getElementById('statustext').textContent = blk.length ? (blk.length===1?'Change this before anything else.':'Change these before anything else.') : '';
if(blk.length){document.getElementById('status').classList.add('block');document.getElementById('blocking').innerHTML=blk.map((f,i)=>card(f,i,'b')).join('')}
document.getElementById('improve').innerHTML = imp.map((f,i)=>card(f,i,'i')).join('');
const WORDS=['No','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'],numWord=n=>n<WORDS.length?WORDS[n]:String(n);
document.getElementById('headline').textContent = blk.length ? 'This part cannot be machined as drawn' : imp.length ? `${numWord(imp.length)} change${imp.length===1?'':'s'} before a shop sees this` : 'Nothing to change before a shop sees this';

function run(f){stop();stage.dataset.view='moving';api.highlight(f.faces||[]);   // data-view on the stage: "moving" until the view has arrived and been checked, then "settled"
  try{running={a:api.focus(f.faces||[]),f,t0:null}}catch(err){console.error('view failed to start:',err);stop();api.highlight(f.faces||[])}}

VIEW.clear=()=>{stop();paint([])};
VIEW.still=()=>{   // a picture of the whole part, nothing lit, for print; the live view is put back as it was
